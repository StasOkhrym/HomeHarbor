<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">
  <title>Enrollment invite</title>
  <link rel="stylesheet" href="/assets/admin.css">
</head>
<body>
  <main>
    <h1>Enrollment invite created</h1>
    <p>Copy this token into the separate secure invite channel. It is shown only on this page.</p>
    <p><strong>Role:</strong> {{.Role}}</p>
    <p><strong>Expires:</strong> {{.ExpiresAt}}</p>
    <label for="token">One-time token</label>
    <textarea id="token" rows="4" readonly>{{.Token}}</textarea>
    <p><a href="/admin/">Return to admin</a></p>
  </main>
</body>
</html>
