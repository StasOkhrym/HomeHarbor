[server]
listen_address = ":8080"
public_url = "https://tunnel.example.com"

[database]
url = "postgres://go_tunnels:change-me@postgres:5432/go_tunnels?sslmode=disable"
password_file = "/run/secrets/postgres_password"

[auth]
rp_id = "tunnel.example.com"
rp_origin = "https://tunnel.example.com"
session_signing_key_file = "/run/secrets/session_signing_key"
ceremony_encryption_key_file = "/run/secrets/ceremony_encryption_key"
session_ttl = "12h"
ceremony_ttl = "5m"

[relay]
public_url = "wss://relay.example.com/relay/v1"

[observability]
metrics_address = ":9090"
