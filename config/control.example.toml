[server]
listen_address = ":8080"
public_url = "https://tunnel.example.com"

[database]
driver = "postgres"
url = "postgres://homeharbor@db:5432/homeharbor?sslmode=disable"
password_file = "/run/secrets/postgres_password"

[redis]
url = "redis://redis:6379/0"
password_file = "/run/secrets/redis_password"
# Overrides: HOMEHARBOR_REDIS_URL and HOMEHARBOR_REDIS_PASSWORD.
# The key prefix is derived from networking.network_id by the control runtime.

[auth]
# Fresh owner bootstrap is loopback-only. Enable temporarily for an explicitly
# controlled setup behind a container/proxy; disable after owner setup.
allow_remote_setup = false
rp_id = "tunnel.example.com"
rp_origin = "https://tunnel.example.com"
session_signing_key_file = "/run/secrets/session_signing_key"
ceremony_encryption_key_file = "/run/secrets/ceremony_encryption_key"
session_ttl = "12h"
ceremony_ttl = "5m"

# Optional authenticated SMTP. Development uses a capture-only Compose overlay.
# Secrets resolve only when enabled; migrations do not open these files.
[smtp]
enabled = false
host = ""
port = 587
username = ""
password_file = "/run/secrets/smtp_password"
from = "homeharbor@example.test"
mode = "starttls"
timeout = "10s"
# Optional private SMTP CA. Omit to use the system certificate roots.
# ca_file = "/run/secrets/smtp_tls_ca"

[relay]
public_url = "wss://relay.example.com/relay/udp"
ticket_key_file = "/run/secrets/relay_ticket_key"
ticket_ttl = "5m"

[networking]
network_id = "home"

[dns]
enabled = true

[security]
# The public half of the trusted Mac companion root key. The private key never
# belongs on the control plane. Control refuses to start without this trust
# anchor; the local initializer mounts it from the generated secret file.
root_public_key_file = "/run/secrets/root_public_key"
trusted_proxy_cidrs = []

[observability]
metrics_address = ":9090"

# Startup-only operational settings. Omission uses these bounded defaults;
# explicit zero/negative values are rejected, never treated as unlimited.
[runtime]
http_header_timeout = "5s"
http_read_timeout = "15s"
http_write_timeout = "30s"
http_idle_timeout = "60s"
shutdown_timeout = "10s"
redis_timeout = "1s"
auth_per_minute = 5
onboarding_per_minute = 10
api_per_minute = 120
companion_ttl = "1m"
claim_ttl = "2m"
credential_ttl = "15m"
