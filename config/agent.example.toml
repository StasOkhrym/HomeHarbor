# Linux gateway runtime. Secrets are referenced by file and never embedded in
# this configuration; command-line flags can override any non-secret value.
[node]
state_path = "state/agent.json"
control_url = "https://control.example"
# enrollment_token_file = "state/gateway-enrollment-token"
name = "linux-gateway"

[relay]
websocket_url = "wss://relay.example/relay/udp"
# ticket_file = "state/relay-ticket"
session_id = ""
destination_device_id = "client"
listen_address = "127.0.0.1:51821"
wireguard_address = "127.0.0.1:51820"

[wireguard]
interface = "wg0"
listen_port = 51820
peer_public_key = ""
overlay_address = "10.200.0.1/32"
allowed_prefixes = "10.200.0.2/32"
routes = ""

[coordination]
url = "wss://control.example/api/v1/coordination"
root_public_key_file = "state/root.pub"
network_id = "home"

[direct]
# candidates = "203.0.113.20:51820"

[dns]
# link = "eth0"
enable_forwarding = false

[runtime]
shutdown_timeout = "10s"
operation_timeout = "30s"
cleanup_timeout = "5s"
