version: "2"

# `make fmt` writes; `make verify` and `make lint` only report.
linters:
  exclusions:
    paths:
      - node_modules/
      - \.superpowers/
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused

formatters:
  exclusions:
    paths:
      - node_modules/
      - \.superpowers/
  enable:
    - gofumpt
    - gci
    - goimports
    - golines
  settings:
    golines:
      # A readable target for breakable Go expressions, not a hard limit on
      # URLs, protocol constants, SQL strings or necessary struct tags.
      max-len: 100
      tab-len: 4
      shorten-comments: false
      chain-split-dots: true
    gci:
      sections:
        - standard
        - default
        - prefix(github.com/sokhrym/go-tunnels)
      custom-order: true
    goimports:
      local-prefixes:
        - github.com/sokhrym/go-tunnels

issues:
  fix: false
