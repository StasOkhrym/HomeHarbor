version: "2"

# `make fmt` writes; `make fmt-check` and `make lint` only report.
linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused

formatters:
  enable:
    - gofumpt
    - gci
    - goimports
  settings:
    gci:
      sections:
        - standard
        - default
        - prefix(github.com/sokhrym/go-tunnels)
      custom-order: true
    goimports:
      local-prefixes:
        - github.com/sokhrym/go-tunnels

issues:
  fix: false
