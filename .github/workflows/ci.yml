name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: "1.27.1"}
      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.14.0
          args: --timeout=5m --fix=false ./...
      - name: Check formatting without edits
        run: make fmt-check
      - name: Test tooling behavior
        run: make scripts-test
      - run: go test -race ./...
      - name: Fuzz protocol parsers
        run: make fuzz
      - run: go vet ./...
      - run: go build ./cmd/...
      - name: Enforce module architecture
        run: make architecture
      - name: Validate Compose secret boundaries
        run: make compose-check
      - name: Validate Ansible deployment bundle
        run: make deploy-check
      - name: Real PostgreSQL and authenticated Redis integration (no skips)
        run: make integration-local
      - name: Vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-37" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6"
      - name: Build Android preview
        run: gradle -p apps/android assembleDebug --stacktrace

  ios-source:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Compile iOS source package
        run: >-
          xcodebuild -packagePath apps/ios -scheme GoTunnelsIOS-Package
          -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO build
