arch: "default"
images:
  - location: "https://cloud-images.ubuntu.com/releases/24.04/release/ubuntu-24.04-server-cloudimg-amd64.img"
    arch: "x86_64"
  - location: "https://cloud-images.ubuntu.com/releases/24.04/release/ubuntu-24.04-server-cloudimg-arm64.img"
    arch: "aarch64"
cpus: 4
memory: "4GiB"
disk: "30GiB"
containerd:
  system: false
  user: false
mounts:
  - location: "~"
    writable: true
provision:
  - mode: system
    script: |
      apt-get update
      apt-get install -y nftables iproute2 wireguard-tools docker.io curl python3
      modprobe tun || true
