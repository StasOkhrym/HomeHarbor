---
- name: Deploy Go Tunnels
  hosts: go_tunnels
  become: true
  vars:
    go_tunnels_dir: /opt/go-tunnels
    # Override these in group_vars for the real DNS names. Keeping explicit
    # defaults makes template validation deterministic without embedding a
    # deployment-specific domain in the repository.
    control_domain: control.tunnel.example.com
    relay_domain: relay.tunnel.example.com
    # DNS length/label bounds are protocol validation, not deployment settings.
    domain_pattern_parts:
      - '^(?=.{1,253}$)(?:[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?\.)+'
      - "[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$"
    domain_pattern: "{{ domain_pattern_parts | join('') }}"
  tasks:
    - name: Require runtime secrets and DNS-01 settings
      ansible.builtin.assert:
        that:
          - go_tunnels_secrets is defined
          - go_tunnels_secrets is mapping
          - acme_email is defined and acme_email | length > 0
          - dns_provider is defined and dns_provider is match('^[a-z0-9_-]+$')
          - dns_provider_file_environment is defined
          - dns_provider_file_environment is mapping
          - dns_provider_file_environment | length > 0
          - control_domain is match(domain_pattern)
          - relay_domain is match(domain_pattern)
          - control_domain != relay_domain
        fail_msg: >-
          Supply runtime secrets, distinct DNS names, ACME email/provider and _FILE environment
      no_log: true
    - name: Validate every required runtime secret
      ansible.builtin.assert:
        that:
          - item in go_tunnels_secrets
          - go_tunnels_secrets[item] is string
          - go_tunnels_secrets[item] | trim | length > 0
        fail_msg: A required runtime secret is absent or empty
      loop:
        [
          postgres_password,
          redis_password,
          session_signing_key,
          ceremony_encryption_key,
          relay_ticket_key,
          root_public_key,
          relay_tls_ca,
          relay_tls_cert,
          relay_tls_key,
          dns_provider_token,
        ]
      no_log: true
    - name: Validate authentication key lengths
      ansible.builtin.assert:
        that:
          - go_tunnels_secrets.ceremony_encryption_key | trim | length == 32
          - go_tunnels_secrets.session_signing_key | trim | length >= 32
          - go_tunnels_secrets.relay_ticket_key | trim | length >= 32
        fail_msg: Authentication keys have invalid lengths
      no_log: true
    - name: Restrict provider environment to secret file references
      ansible.builtin.assert:
        that:
          - item.key is match('^[A-Z][A-Z0-9_]*_FILE$')
          - item.value == '/run/secrets/dns_provider_token'
        fail_msg: >-
          DNS credentials must be mounted only into Traefik, never embedded in environment values
      loop: "{{ dns_provider_file_environment | dict2items }}"
    - name: Install Docker packages
      ansible.builtin.apt:
        name: [docker.io, docker-compose-v2, openssl]
        state: present
        update_cache: true
    - name: Enable Docker
      ansible.builtin.service:
        name: docker
        enabled: true
        state: started
    - name: Create application directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: "0750"
      loop:
        [
          "{{ go_tunnels_dir }}",
          "{{ go_tunnels_dir }}/config",
          "{{ go_tunnels_dir }}/deploy",
          "{{ go_tunnels_dir }}/secrets",
        ]
    - name: Create persistent proxy certificate store
      ansible.builtin.file:
        path: "{{ go_tunnels_dir }}/state/traefik"
        state: directory
        owner: "65532"
        group: "65532"
        mode: "0700"
    - name: Copy explicit build and deployment bundle
      ansible.builtin.copy:
        src: "../../{{ item }}"
        dest: "{{ go_tunnels_dir }}/{{ item }}"
        owner: root
        group: root
        mode: preserve
      # Trailing slashes copy directory contents. Runtime config and proxy
      # routes are rendered below, never overwritten by example files.
      loop:
        [
          go.mod,
          go.sum,
          .dockerignore,
          cmd/,
          internal/,
          migrations/,
          deploy/Dockerfile,
          deploy/compose.yaml,
        ]
      notify: Restart Go Tunnels
    - name: Allow only the runtime group to read proxy routing files
      ansible.builtin.file:
        path: "{{ go_tunnels_dir }}/deploy/traefik/dynamic"
        state: directory
        owner: root
        group: "65532"
        mode: "0750"
    - name: Write deployment secrets
      ansible.builtin.copy:
        content: "{{ go_tunnels_secrets[item] | trim }}\n"
        dest: "{{ go_tunnels_dir }}/secrets/{{ item }}"
        owner: root
        group: "65532"
        mode: "0640"
      no_log: true
      loop:
        [
          postgres_password,
          redis_password,
          session_signing_key,
          ceremony_encryption_key,
          relay_ticket_key,
          root_public_key,
          relay_tls_ca,
          relay_tls_cert,
          relay_tls_key,
          dns_provider_token,
        ]
      notify: Restart Go Tunnels
    - name: Render service configuration
      ansible.builtin.template:
        src: "templates/{{ item }}.toml.j2"
        dest: "{{ go_tunnels_dir }}/config/{{ item }}.toml"
        owner: root
        group: "65532"
        mode: "0640"
      no_log: true
      loop: [control, relay]
      notify: Restart Go Tunnels
    - name: Render production-only proxy configuration
      ansible.builtin.template:
        src: "templates/{{ item.source }}.j2"
        dest: "{{ go_tunnels_dir }}/{{ item.destination }}"
        owner: root
        group: "65532"
        mode: "0640"
      loop:
        - { source: traefik.toml, destination: deploy/traefik/traefik.toml }
        - { source: proxy-routes.toml, destination: deploy/traefik/dynamic/routes.toml }
        - { source: compose.production.yaml, destination: deploy/compose.production.yaml }
      notify: Restart Go Tunnels
    - name: Verify backend certificate chain and relay identity
      ansible.builtin.command:
        argv:
          [
            openssl,
            verify,
            -CAfile,
            "{{ go_tunnels_dir }}/secrets/relay_tls_ca",
            -verify_hostname,
            relay,
            "{{ go_tunnels_dir }}/secrets/relay_tls_cert",
          ]
      changed_when: false
    - name: Read relay certificate public key
      ansible.builtin.command:
        argv: [openssl, x509, -in, "{{ go_tunnels_dir }}/secrets/relay_tls_cert", -pubkey, -noout]
      register: relay_certificate_public
      changed_when: false
      no_log: true
    - name: Read relay private key public half
      ansible.builtin.command:
        argv: [openssl, pkey, -in, "{{ go_tunnels_dir }}/secrets/relay_tls_key", -pubout]
      register: relay_private_public
      changed_when: false
      no_log: true
    - name: Require a matching relay TLS pair
      ansible.builtin.assert:
        that: relay_certificate_public.stdout == relay_private_public.stdout
      no_log: true
    - name: Validate rendered Compose before restarting services
      ansible.builtin.command:
        cmd: docker compose -f deploy/compose.yaml -f deploy/compose.production.yaml config --quiet
        chdir: "{{ go_tunnels_dir }}"
      environment:
        CONTROL_DOMAIN: "{{ control_domain }}"
        RELAY_DOMAIN: "{{ relay_domain }}"
      changed_when: false
  handlers:
    - name: Build Go Tunnels
      listen: Restart Go Tunnels
      ansible.builtin.command:
        cmd: docker compose -f deploy/compose.yaml -f deploy/compose.production.yaml build
        chdir: "{{ go_tunnels_dir }}"
      changed_when: true
    - name: Roll out Go Tunnels
      listen: Restart Go Tunnels
      ansible.builtin.command:
        cmd: >-
          docker compose -f deploy/compose.yaml -f deploy/compose.production.yaml
          up -d --force-recreate --remove-orphans --wait --wait-timeout 180
        chdir: "{{ go_tunnels_dir }}"
      environment:
        CONTROL_DOMAIN: "{{ control_domain }}"
        RELAY_DOMAIN: "{{ relay_domain }}"
      changed_when: true
