[entryPoints.web]
address = ":8080"
[entryPoints.web.http.redirections.entryPoint]
to = "websecure"
scheme = "https"
port = "443"

[entryPoints.websecure]
address = ":8443"

[providers.file]
directory = "/etc/traefik/dynamic"
watch = true

[ping]
entryPoint = "websecure"

[log]
format = "json"
level = "INFO"

# Production example. Set your email/provider before deployment; only the
# proxy receives DNS API credentials, preferably via the provider's _FILE vars.
[certificatesResolvers.public.acme]
email = "operator@example.com"
storage = "/var/lib/traefik/acme.json"
[certificatesResolvers.public.acme.dnsChallenge]
provider = "cloudflare"
