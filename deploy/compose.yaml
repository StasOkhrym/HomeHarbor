services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: go_tunnels
      POSTGRES_USER: go_tunnels
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U go_tunnels -d go_tunnels"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  redis:
    image: redis:8.2-alpine
    # Hash the file credential into a temporary ACL. Neither the password nor
    # a plaintext password argument is passed to the Redis server process.
    entrypoint: ["sh", "-ec"]
    command:
      - |
        password=$$(cat /run/secrets/redis_password)
        test -n "$$password"
        hash=$$(printf '%s' "$$password" | sha256sum | cut -d ' ' -f 1)
        printf 'user default on #%s ~* &* +@all\n' "$$hash" > /tmp/users.acl
        unset password hash
        exec redis-server --aclfile /tmp/users.acl --bind 0.0.0.0 \
          --protected-mode yes --maxmemory 128mb --maxmemory-policy noeviction \
          --appendonly no --save ""
    secrets: [redis_password]
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$(cat /run/secrets/redis_password) redis-cli ping | grep -qx PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 256m
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    restart: unless-stopped
  control:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: control
    command: ["-config", "/etc/go-tunnels/control.toml"]
    configs:
      - source: control_config
        target: /etc/go-tunnels/control.toml
    secrets: [postgres_password, redis_password, session_signing_key, ceremony_encryption_key, relay_ticket_key, root_public_key]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "/healthcheck", "http://127.0.0.1:8080/readyz"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    init: true
    restart: unless-stopped
  migrate:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: migrate
    command: ["-config", "/etc/go-tunnels/control.toml"]
    configs:
      - source: control_config
        target: /etc/go-tunnels/control.toml
    # Schema migration must not receive browser, WebAuthn, or relay secrets.
    # Its dedicated config loader reads only the database section.
    secrets: [postgres_password]
    depends_on:
      postgres: {condition: service_healthy}
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    init: true
    restart: "no"
  relay:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: relay
    command: ["-config", "/etc/go-tunnels/relay.toml"]
    configs:
      - source: relay_config
        target: /etc/go-tunnels/relay.toml
    secrets: [relay_ticket_key, relay_tls_cert, relay_tls_key, relay_tls_ca]
    environment:
      SSL_CERT_FILE: /run/secrets/relay_tls_ca
    ports: ["51820-51851:51820-51851/udp"]
    healthcheck:
      test: ["CMD", "/healthcheck", "https://127.0.0.1:8081/readyz"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    init: true
    restart: unless-stopped
  caddy:
    image: caddy:2.10-alpine
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      CONTROL_DOMAIN: ${CONTROL_DOMAIN:-control.localhost}
      RELAY_DOMAIN: ${RELAY_DOMAIN:-relay.localhost}
    volumes:
      - ./${CADDYFILE:-Caddyfile}:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    secrets: [relay_tls_ca]
    depends_on:
      control: {condition: service_healthy}
      relay: {condition: service_healthy}
    security_opt: [no-new-privileges:true]
    # Docker Desktop rejects execve for the Caddy image with an entirely empty
    # capability set. This is the only capability Caddy needs for the host
    # ports below; it does not grant network administration or raw sockets.
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    init: true
    restart: unless-stopped
configs:
  control_config:
    file: "${CONTROL_CONFIG:-../config/control.toml}"
  relay_config:
    file: "${RELAY_CONFIG:-../config/relay.toml}"
secrets:
  postgres_password: {file: ../secrets/postgres_password}
  redis_password: {file: ../secrets/redis_password}
  relay_ticket_key: {file: ../secrets/relay_ticket_key}
  session_signing_key: {file: ../secrets/session_signing_key}
  ceremony_encryption_key: {file: ../secrets/ceremony_encryption_key}
  root_public_key: {file: ../secrets/root_public_key}
  relay_tls_cert: {file: ../secrets/relay_tls_cert}
  relay_tls_key: {file: ../secrets/relay_tls_key}
  relay_tls_ca: {file: ../secrets/relay_tls_ca}
volumes:
  postgres-data:
  caddy-data:
  caddy-config:
