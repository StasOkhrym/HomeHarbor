name: homeharbor

services:
  db:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: homeharbor
      POSTGRES_USER: homeharbor
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U homeharbor -d homeharbor"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  redis:
    image: redis:8.2-alpine
    # Hash the file credential into a temporary ACL. Neither the password nor
    # a plaintext password argument is passed to the Redis server process.
    entrypoint: ["sh", "-ec"]
    command:
      - |
        password=$$(cat /run/secrets/redis_password)
        test -n "$$password"
        hash=$$(printf '%s' "$$password" | sha256sum | cut -d ' ' -f 1)
        printf 'user default on #%s ~* &* +@all\n' "$$hash" > /tmp/users.acl
        unset password hash
        exec redis-server --aclfile /tmp/users.acl --bind 0.0.0.0 \
          --protected-mode yes --maxmemory 128mb --maxmemory-policy noeviction \
          --appendonly no --save ""
    secrets: [redis_password]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "REDISCLI_AUTH=$$(cat /run/secrets/redis_password) redis-cli ping | grep -qx PONG",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 256m
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    restart: unless-stopped
  control:
    user: "${RUNTIME_UID:-65532}:${RUNTIME_GID:-65532}"
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: control
    command: ["-config", "/etc/homeharbor/control.toml"]
    configs:
      - source: control_config
        target: /etc/homeharbor/control.toml
    secrets:
      [
        postgres_password,
        redis_password,
        session_signing_key,
        ceremony_encryption_key,
        relay_ticket_key,
        root_public_key,
      ]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "/healthcheck", "http://127.0.0.1:8080/readyz"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    init: true
    restart: unless-stopped
  migrate:
    user: "${RUNTIME_UID:-65532}:${RUNTIME_GID:-65532}"
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: migrate
    command: ["--config", "/etc/homeharbor/control.toml"]
    configs:
      - source: control_config
        target: /etc/homeharbor/control.toml
    # Schema migration must not receive browser, WebAuthn, or relay secrets.
    # Its dedicated config loader reads only the database section.
    secrets: [postgres_password]
    depends_on:
      db: { condition: service_healthy }
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    init: true
    restart: "no"
  relay:
    user: "${RUNTIME_UID:-65532}:${RUNTIME_GID:-65532}"
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: relay
    command: ["-config", "/etc/homeharbor/relay.toml"]
    configs:
      - source: relay_config
        target: /etc/homeharbor/relay.toml
    secrets: [relay_ticket_key, relay_tls_cert, relay_tls_key, relay_tls_ca]
    environment:
      SSL_CERT_FILE: /run/secrets/relay_tls_ca
    # Backend/UI development has no public tunnel ingress.
    healthcheck:
      test: ["CMD", "/healthcheck", "https://relay:8081/readyz"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    init: true
    restart: unless-stopped
  traefik:
    image: traefik:v3.7.13
    user: "${RUNTIME_UID:-65532}:${RUNTIME_GID:-65532}"
    command: ["--configFile=/etc/traefik/traefik.toml"]
    ports:
      [
        "${PROXY_BIND_ADDRESS:-127.0.0.1}:${PROXY_HTTP_PORT:-8088}:8080",
        "${PROXY_BIND_ADDRESS:-127.0.0.1}:${PROXY_HTTPS_PORT:-8443}:8443",
      ]
    configs:
      - source: proxy_config
        target: /etc/traefik/traefik.toml
    volumes:
      - ${TRAEFIK_DYNAMIC_DIR:-../.local/traefik/dynamic}:/etc/traefik/dynamic:ro
      - ${TRAEFIK_STATE_DIR:-../.local/traefik/state}:/var/lib/traefik
    secrets: [relay_tls_ca, frontend_tls_cert, frontend_tls_key]
    depends_on:
      control: { condition: service_healthy }
      relay: { condition: service_healthy }
    security_opt: [no-new-privileges:true]
    # Unprivileged container ports allow a genuinely empty capability set.
    cap_drop: [ALL]
    read_only: true
    tmpfs: [/tmp]
    healthcheck:
      test:
        [
          "CMD",
          "traefik",
          "healthcheck",
          "--ping",
          "--ping.entrypoint=websecure",
          "--entrypoints.websecure.address=:8443",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
    init: true
    restart: unless-stopped
configs:
  proxy_config:
    file: "${TRAEFIK_CONFIG:-./traefik/local.toml}"
  control_config:
    file: "${CONTROL_CONFIG:-../.local/control.toml}"
  relay_config:
    file: "${RELAY_CONFIG:-../.local/relay.toml}"
secrets:
  postgres_password: { file: ../secrets/postgres_password }
  redis_password: { file: ../secrets/redis_password }
  relay_ticket_key: { file: ../secrets/relay_ticket_key }
  session_signing_key: { file: ../secrets/session_signing_key }
  ceremony_encryption_key: { file: ../secrets/ceremony_encryption_key }
  root_public_key: { file: ../secrets/root_public_key }
  relay_tls_cert: { file: ../secrets/relay_tls_cert }
  relay_tls_key: { file: ../secrets/relay_tls_key }
  relay_tls_ca: { file: ../secrets/relay_tls_ca }
  frontend_tls_cert: { file: ../secrets/frontend_tls_cert }
  frontend_tls_key: { file: ../secrets/frontend_tls_key }
volumes:
  postgres-data:
