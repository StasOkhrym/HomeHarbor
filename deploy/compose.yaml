services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: go_tunnels
      POSTGRES_USER: go_tunnels
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U go_tunnels -d go_tunnels"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  control:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: control
    command: ["-config", "/etc/go-tunnels/control.toml"]
    configs:
      - source: control_config
        target: /etc/go-tunnels/control.toml
    secrets: [postgres_password, session_signing_key, ceremony_encryption_key]
    depends_on:
      postgres: {condition: service_healthy}
    restart: unless-stopped
  relay:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: relay
    command: ["-config", "/etc/go-tunnels/relay.toml"]
    configs:
      - source: relay_config
        target: /etc/go-tunnels/relay.toml
    secrets: [relay_ticket_key]
    restart: unless-stopped
  caddy:
    image: caddy:2.10-alpine
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      CONTROL_DOMAIN: ${CONTROL_DOMAIN}
      RELAY_DOMAIN: ${RELAY_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [control, relay]
    restart: unless-stopped
configs:
  control_config: {file: ../config/control.toml}
  relay_config: {file: ../config/relay.toml}
secrets:
  postgres_password: {file: ../secrets/postgres_password}
  relay_ticket_key: {file: ../secrets/relay_ticket_key}
  session_signing_key: {file: ../secrets/session_signing_key}
  ceremony_encryption_key: {file: ../secrets/ceremony_encryption_key}
volumes:
  postgres-data:
  caddy-data:
  caddy-config:
